name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run verify:quality
        env:
          DATABASE_URL: file:${{ runner.temp }}/student-track-build.db
          VERIFY_ARTIFACT_NAME: verification-quality-${{ github.run_id }}
      - name: Upload quality verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-quality-${{ github.run_id }}
          path: .verification-logs
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
