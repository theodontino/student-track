name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    env:
      STUDENT_TRACK_EDITION: full
      NEXT_PUBLIC_STUDENT_TRACK_EDITION: full
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run verify:quality
        env:
          DATABASE_URL: file:${{ runner.temp }}/student-track-build.db
          VERIFY_ARTIFACT_NAME: verification-quality-${{ github.run_id }}
      - name: Upload quality verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-quality-${{ github.run_id }}
          path: .verification-logs
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  windows-core:
    timeout-minutes: 35
    runs-on: windows-latest
    env:
      STUDENT_TRACK_EDITION: core
      NEXT_PUBLIC_STUDENT_TRACK_EDITION: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          architecture: x64
          cache: npm
      - name: Validate Windows PowerShell entrypoints
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Prepare Student Track Core from source
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:LOCALAPPDATA "Student Track"
          $dataRoot = Join-Path $runtimeRoot "data"
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $settingsPath = Join-Path $dataRoot "llm-settings.json"
          $settings = '{"activeProfileId":null,"profiles":[],"roleAssignments":{"feedbackDraftProfileId":null,"feedbackReviewProfileId":null,"wecomExtractionProfileId":null}}'
          Set-Content -LiteralPath $settingsPath -Value $settings -NoNewline -Encoding utf8

          & .\scripts\windows\Prepare-StudentTrackCore.ps1 -AllowGitHubActionsServerForCI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($directory in @("database", "data", "feedback-attachments", "feedback-inbox", "archives")) {
            $path = Join-Path $runtimeRoot $directory
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "准备脚本未创建运行目录：$path"
            }
          }
          $databasePath = Join-Path $runtimeRoot "database\student-track.db"
          if (-not (Test-Path -LiteralPath $databasePath -PathType Leaf) -or (Get-Item -LiteralPath $databasePath).Length -eq 0) {
            throw "准备脚本未建立完成迁移的 SQLite 数据库。"
          }
          if ((Get-Content -LiteralPath $settingsPath -Raw) -ne $settings) {
            throw "准备脚本改写了既有 LLM 设置。"
          }

          "DATABASE_URL=$($env:DATABASE_URL)" >> $env:GITHUB_ENV
          "STUDENT_TRACK_RUNTIME_ROOT=$runtimeRoot" >> $env:GITHUB_ENV
          "STUDENT_TRACK_DATA_ROOT=$dataRoot" >> $env:GITHUB_ENV
          "STUDENT_TRACK_ARCHIVES_ROOT=$(Join-Path $runtimeRoot 'archives')" >> $env:GITHUB_ENV
          "STUDENT_TRACK_FEEDBACK_ATTACHMENTS_ROOT=$(Join-Path $runtimeRoot 'feedback-attachments')" >> $env:GITHUB_ENV
          "STUDENT_TRACK_FEEDBACK_INBOX_ROOT=$(Join-Path $runtimeRoot 'feedback-inbox')" >> $env:GITHUB_ENV
      - run: npm run verify:quality
        env:
          VERIFY_ARTIFACT_NAME: verification-windows-core-${{ github.run_id }}
      - run: npm run build
      - name: Start, persist, and bind only to loopback
        shell: pwsh
        run: |
          $startScript = Join-Path $env:GITHUB_WORKSPACE "scripts\windows\Start-StudentTrackCore.ps1"
          $stdout = Join-Path $env:RUNNER_TEMP "student-track-core.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "student-track-core.stderr.log"

          function Start-CoreServer {
            return Start-Process -FilePath "powershell.exe" -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$startScript`"", "-AllowGitHubActionsServerForCI"
            ) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          }
          function Show-CoreServerLogs {
            Write-Host "::group::Student Track Core stdout"
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Tail 200 }
            Write-Host "::endgroup::"
            Write-Host "::group::Student Track Core stderr"
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Tail 200 }
            Write-Host "::endgroup::"
          }
          function Wait-CoreServer([System.Diagnostics.Process]$Process) {
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            while ($timer.Elapsed.TotalSeconds -lt 60) {
              $Process.Refresh()
              if ($Process.HasExited) {
                Show-CoreServerLogs
                throw "Student Track Core 启动进程提前退出（退出码 $($Process.ExitCode)）。"
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:3000/api/semesters" -TimeoutSec 1
                if ($response.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Seconds 1
            }
            Show-CoreServerLogs
            throw "Student Track Core 未在 60 秒内启动。"
          }
          function Stop-CoreServer([System.Diagnostics.Process]$Process) {
            if (-not $Process.HasExited) {
              & taskkill.exe /PID $Process.Id /T /F | Out-Null
              $Process.WaitForExit()
            }
          }

          $server = Start-CoreServer
          try {
            Wait-CoreServer $server
            $listeners = @(Get-NetTCPConnection -State Listen -LocalPort 3000)
            if ($listeners.Count -eq 0 -or @($listeners | Where-Object LocalAddress -ne "127.0.0.1").Count -gt 0) {
              throw "生产服务存在非 127.0.0.1 的监听地址。"
            }
            $body = @{ name = "Core CI 持久化学期"; startDate = "2099-01-01"; endDate = "2099-06-30" } | ConvertTo-Json
            $created = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:3000/api/semesters" -ContentType "application/json" -Body $body
            if (-not $created.id) { throw "生产服务未创建最小学期。" }
          } finally {
            Stop-CoreServer $server
          }

          $server = Start-CoreServer
          try {
            Wait-CoreServer $server
            $semesters = @(Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:3000/api/semesters")
            if (-not ($semesters | Where-Object name -eq "Core CI 持久化学期")) {
              throw "生产服务重启后未读到先前写入的学期。"
            }
          } finally {
            Stop-CoreServer $server
          }
      - run: npx playwright install chromium
      - name: Run Core browser contract
        run: node --import tsx scripts/run-isolated-tests.ts playwright --fixture=core --project=chromium e2e/core-edition.spec.ts
      - name: Upload Windows Core verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-windows-core-${{ github.run_id }}
          path: .verification-logs
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
