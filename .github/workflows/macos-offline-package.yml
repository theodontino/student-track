name: Build macOS Full offline bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 已通过同提交 macOS Full CI 的完整提交 SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    timeout-minutes: 45
    runs-on: macos-latest
    env:
      STUDENT_TRACK_EDITION: full
      NEXT_PUBLIC_STUDENT_TRACK_EDITION: full
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Verify requested source commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "离线包只能从完整提交 SHA 构建。" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$REQUESTED_REF" ]]; then
            echo "检出的提交与请求的离线包提交不一致。" >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Configure isolated build database
        run: echo "DATABASE_URL=file:$RUNNER_TEMP/student-track-macos-bundle-build.db" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Build and verify offline bundle
        run: |
          output_root="$RUNNER_TEMP/student-track-full-offline-bundle"
          scratch_root="$RUNNER_TEMP/student-track-full-offline-check"
          ./scripts/macos/Build-StudentTrackFullOfflineBundle.sh --output "$output_root"
          archive_path="$(find "$output_root" -maxdepth 1 -name 'StudentTrackFull-macOS-*.zip' -type f -print -quit)"
          if [[ -z "$archive_path" ]]; then
            echo "离线包构建没有产生 ZIP。" >&2
            exit 1
          fi
          ./scripts/macos/Test-StudentTrackFullOfflineBundle.sh --archive "$archive_path" --scratch "$scratch_root"
          echo "OFFLINE_BUNDLE=$archive_path" >> "$GITHUB_ENV"
          source_commit="$(node -e 'process.stdout.write(require(process.argv[1]).sourceCommit)' "$scratch_root/expanded/StudentTrackFull/BUILD-INFO.json")"
          echo "OFFLINE_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - name: Upload macOS Full offline bundle
        uses: actions/upload-artifact@v7
        with:
          name: student-track-full-macos-${{ env.OFFLINE_SOURCE_COMMIT }}
          path: ${{ env.OFFLINE_BUNDLE }}
          if-no-files-found: error
          retention-days: 14
